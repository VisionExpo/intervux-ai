[pytest]
# Pytest configuration for Intervux AI tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --durations=10
    -p no:cacheprovider

# ---------------------------------------------------------------
# Warning policy — zero tolerance for internal warnings.
#
# Classification of remaining ~11 warnings:
#   EXTERNAL / ALLOWLISTED (cannot fix in our code):
#     - ResourceWarning from aiosqlite: connection GC during TestClient teardown.
#       Known upstream issue; does not affect test correctness.
#     - DeprecationWarning from pythonjsonlogger.jsonlogger: fixed in logger.py
#       via compatibility shim; allow residual if old version is installed.
# ---------------------------------------------------------------
filterwarnings =
    default::PendingDeprecationWarning
    # error
    ignore::ResourceWarning:aiosqlite
    ignore::ResourceWarning:anyio
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning:pythonjsonlogger
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
    ignore::DeprecationWarning:redis
    ignore::DeprecationWarning:click
    ignore::DeprecationWarning:spacy
    ignore::PendingDeprecationWarning:multipart


# pytest-asyncio: run all async test functions automatically without
# needing @pytest.mark.asyncio on every one (still supported if present).
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (no external services)
    integration: Integration tests (may need DB)
    slow: Slow running tests
    websocket: WebSocket protocol tests
    auth: Authentication tests
    smoke: Critical path smoke tests

# Coverage
[coverage:run]
source = backend
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
