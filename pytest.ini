[pytest]
# Pytest configuration for Intervux AI tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# pytest-asyncio: run all async test functions automatically without
# needing @pytest.mark.asyncio on every one (still supported if present).
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (no external services)
    integration: Integration tests (may need DB)
    slow: Slow running tests
    websocket: WebSocket protocol tests
    auth: Authentication tests

# Coverage
[coverage:run]
source = backend
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
