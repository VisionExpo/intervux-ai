name: CI Gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gate:
    name: test-gate (python-3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak libespeak1 libportaudio2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Compile backend and tests
        run: |
          python -m compileall backend tests

      - name: Check repository files are UTF-8
        run: python backend/scripts/check_utf8.py

      - name: Run tests
        run: pytest -vv
