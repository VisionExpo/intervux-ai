# =============================================================================
# Intervux AI - Docker Compose Configuration
# =============================================================================
# Production-grade setup with:
# - FastAPI API server
# - Celery background workers
# - Redis task broker
# - PostgreSQL database
# - Flower monitoring dashboard
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: intervux-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intervux}
      POSTGRES_USER: ${POSTGRES_USER:-intervux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intervux}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intervux}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Cache and Message Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: intervux-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: intervux-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-intervux}
      - POSTGRES_USER=${POSTGRES_USER:-intervux}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-intervux}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: intervux-worker
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-intervux}
      - POSTGRES_USER=${POSTGRES_USER:-intervux}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-intervux}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Flower Monitoring Dashboard
  # ---------------------------------------------------------------------------
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: intervux-flower
    command: celery -A backend.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - worker
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Volumes for persistent data
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  default:
    name: intervux-network

