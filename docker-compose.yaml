services:
  db:
    image: postgres:15
    container_name: intervux-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Vishal}
      POSTGRES_DB: ${POSTGRES_DB:-intervux}
    volumes:
      - ./backend:/app/backend
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intervux}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: intervux-redis
    volumes:
      - ./backend:/app/backend
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intervux-frontend
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env.docker
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervux-backend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--reload"]
    env_file:
      - backend/.env
    environment:
      RUN_DB_MIGRATIONS: "true"
      AUTO_STAMP_DB: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./docker/entrypoint.sh:/app/entrypoint.sh:ro
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervux-worker
    entrypoint: ["/app/entrypoint.sh"]
    command: celery -A backend.core.celery_app:celery_app worker -l info --concurrency=2
    env_file:
      - backend/.env
    environment:
      RUN_DB_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./docker/entrypoint.sh:/app/entrypoint.sh:ro
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, subprocess, sys; host=os.getenv('HOSTNAME',''); out=subprocess.run(['celery','-A','backend.core.celery_app:celery_app','inspect','ping','-d',f'celery@{host}'], capture_output=True, text=True); sys.exit(0 if out.returncode==0 and 'pong' in out.stdout.lower() else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervux-beat
    command: celery -A backend.core.celery_app:celery_app beat -l info
    env_file:
      - backend/.env
    environment:
      RUN_DB_MIGRATIONS: "false"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervux-flower
    command: >
      sh -c "test -n \"$$FLOWER_BASIC_AUTH\" ||
      { echo 'FLOWER_BASIC_AUTH must be set'; exit 1; };
      celery -A backend.core.celery_app:celery_app flower --port=5555 --basic_auth=$$FLOWER_BASIC_AUTH"
    env_file:
      - backend/.env
    environment:
      RUN_DB_MIGRATIONS: "false"
      FLOWER_BASIC_AUTH: "admin:admin"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, urllib.error, sys; req=urllib.request.Request('http://localhost:5555/');\ntry:\n urllib.request.urlopen(req); sys.exit(0)\nexcept urllib.error.HTTPError as e:\n sys.exit(0 if e.code==401 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
  redis_data:
